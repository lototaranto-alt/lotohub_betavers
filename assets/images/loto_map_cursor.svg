<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradiente Dorato Elegante -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="50%" stop-color="#FFF8DC" />
      <stop offset="100%" stop-color="#DAA520" />
    </linearGradient>
    
    <!-- Ombreggiatura per leggibilità su mappe chiare -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- L'Indicatore Direzionale (La Foglia punta verso Nord / Ore 12) -->
  <path d="M50,5 C35,25 42,38 50,48 C58,38 65,25 50,5 Z" fill="url(#gold)" filter="url(#shadow)"/>
  
  <!-- Il Nucleo (Smeraldo scuro, ma sovrascrivibile via codice React Native) -->
  <circle cx="50" cy="55" r="26" fill="#1A3621" stroke="url(#gold)" stroke-width="4" filter="url(#shadow)"/>
  
  <!-- Il Seme Centrale (Dorato) -->
  <circle cx="50" cy="55" r="10" fill="url(#gold)" />
</svg>
